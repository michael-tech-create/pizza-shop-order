<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — McMichael Pizza</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }
        .input-field:focus { border-color: #f97316; }
        .input-field.input-error { border-color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 max-w-md w-full p-8">

        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-2 text-gray-900 font-black text-xl hover:text-orange-600 transition-colors">
                🍕 Mc's Pizza
            </a>
        </div>

        <div class="flex border-b border-gray-100 mb-6">
            <button id="tabLogin" onclick="showAuthTab('login')"
                class="flex-1 py-3 text-center text-sm font-bold text-orange-600 border-b-2 border-orange-500">
                Log In
            </button>
            <button id="tabSignup" onclick="showAuthTab('signup')"
                class="flex-1 py-3 text-center text-sm font-semibold text-gray-400 border-b-2 border-transparent">
                Sign Up
            </button>
        </div>

        <div id="errorBanner" class="hidden mb-4 bg-red-50 border border-red-100 text-red-700 text-sm font-medium rounded-xl px-4 py-3"></div>

        <!-- LOG IN -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">Phone Number</label>
                <input id="login-phone" type="tel" class="input-field" placeholder="e.g. 08012345678" autocomplete="tel">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">Password</label>
                <input id="login-password" type="password" class="input-field" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" id="loginBtn"
                class="w-full bg-orange-600 hover:bg-orange-500 active:scale-95 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                Log In
            </button>
        </form>

        <!-- SIGN UP -->
        <form id="signupForm" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">Full Name</label>
                <input id="signup-name" type="text" class="input-field" placeholder="e.g. Emeka Okonkwo" autocomplete="name">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">Phone Number</label>
                <input id="signup-phone" type="tel" class="input-field" placeholder="e.g. 08012345678" autocomplete="tel">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">Password</label>
                <input id="signup-password" type="password" class="input-field" placeholder="At least 6 characters" autocomplete="new-password">
            </div>
            <button type="submit" id="signupBtn"
                class="w-full bg-gray-900 hover:bg-black active:scale-95 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                Create Account
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-6">
            Accounts are optional — you can always
            <a href="checkout.html" class="text-orange-600 font-semibold hover:underline">check out as a guest</a> instead.
        </p>
    </div>

    <script src="./js/customer_auth.js"></script>
    <script>
        const phoneRegex = /^(\+234|0)[789]\d{9}$/;

        function showAuthTab(tab) {
            const isLogin = tab === "login";
            document.getElementById("loginForm").classList.toggle("hidden", !isLogin);
            document.getElementById("signupForm").classList.toggle("hidden", isLogin);
            document.getElementById("tabLogin").className = isLogin
                ? "flex-1 py-3 text-center text-sm font-bold text-orange-600 border-b-2 border-orange-500"
                : "flex-1 py-3 text-center text-sm font-semibold text-gray-400 border-b-2 border-transparent";
            document.getElementById("tabSignup").className = !isLogin
                ? "flex-1 py-3 text-center text-sm font-bold text-orange-600 border-b-2 border-orange-500"
                : "flex-1 py-3 text-center text-sm font-semibold text-gray-400 border-b-2 border-transparent";
            hideError();
        }
        window.showAuthTab = showAuthTab;

        function showError(msg) {
            const el = document.getElementById("errorBanner");
            el.textContent = msg;
            el.classList.remove("hidden");
        }
        function hideError() {
            document.getElementById("errorBanner").classList.add("hidden");
        }

        // If already logged in, no reason to see this page
        if (typeof isCustomerLoggedIn === "function" && isCustomerLoggedIn()) {
            window.location.href = "my-orders.html";
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();
            const phone = document.getElementById("login-phone").value.trim();
            const password = document.getElementById("login-password").value;

            if (!phone || !password) { showError("Enter your phone number and password"); return; }

            const btn = document.getElementById("loginBtn");
            btn.disabled = true; btn.textContent = "Logging in…";
            try {
                await customerLogin(phone, password);
                window.location.href = "my-orders.html";
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false; btn.textContent = "Log In";
            }
        });

        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();
            const name = document.getElementById("signup-name").value.trim();
            const phone = document.getElementById("signup-phone").value.trim();
            const password = document.getElementById("signup-password").value;

            if (!name || !phone || !password) { showError("Fill in all fields"); return; }
            if (!phoneRegex.test(phone)) { showError("Enter a valid Nigerian phone number"); return; }
            if (password.length < 6) { showError("Password must be at least 6 characters"); return; }

            const btn = document.getElementById("signupBtn");
            btn.disabled = true; btn.textContent = "Creating account…";
            try {
                await customerSignup(name, phone, password);
                window.location.href = "my-orders.html";
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false; btn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
