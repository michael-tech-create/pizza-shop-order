<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Slice - Pizza Parallax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Animated Cheese-Lava Gradient (Now used as a semi-transparent overlay) */
        .bg-cheese-lava-overlay {
            background: linear-gradient(45deg, rgba(220, 38, 38, 0.85), rgba(234, 88, 12, 0.85), rgba(250, 204, 21, 0.75), rgba(239, 68, 68, 0.85));
            background-size: 300% 300%;
            animation: gradientLava 8s ease infinite;
        }
        @keyframes gradientLava {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: floatSlow 5s ease-in-out infinite 2s;
        }

        /* Parallax Layer Setup */
        .parallax-layer {
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* Typing Effect */
        .typing-wrapper {
            display: inline-block;
        }
        .typing-text {
            overflow: hidden;
            white-space: nowrap;
            border-right: 4px solid white;
            width: 0;
            animation: typing 2.5s steps(30, end) forwards, blink-caret 0.8s step-end infinite;
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: white; }
        }

        /* Glowing CTA Buttons */
        .glow-btn-primary {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 0 0 30px rgba(251, 146, 60, 0.6);
            transition: all 0.3s ease;
        }
        .glow-btn-primary:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 45px rgba(251, 146, 60, 0.9);
            transform: translateY(-2px) scale(1.02);
        }
        .glow-btn-secondary {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .glow-btn-secondary:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 sm:mt-10 mb-16">
        
        <div id="parallaxContainer" 
             class="relative w-full h-[500px] lg:h-[600px] rounded-[2rem] overflow-hidden shadow-2xl flex items-center group cursor-default"
             style="background-image: url('https://images.unsplash.com/photo-1590947132387-155cc02f3212?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center;">
            
            <div class="absolute inset-0 bg-cheese-lava-overlay z-0"></div>
            
            <div class="absolute inset-0 z-10 overflow-hidden pointer-events-none">
                <img src="https://cdn-icons-png.flaticon.com/512/5141/5141555.png" class="absolute top-10 left-1/4 w-12 opacity-80 animate-float parallax-layer drop-shadow-lg" style="--px: 0; --py: 0;" data-speed="1.5" alt="Basil">
                <img src="https://cdn-icons-png.flaticon.com/512/10756/10756184.png" class="absolute bottom-20 left-10 w-16 opacity-90 animate-float-delayed parallax-layer drop-shadow-lg" style="--px: 0; --py: 0;" data-speed="2.5" alt="Pepperoni">
                <img src="https://cdn-icons-png.flaticon.com/512/5141/5141555.png" class="absolute top-20 right-20 w-10 opacity-70 animate-float parallax-layer drop-shadow-lg scale-x-[-1]" style="--px: 0; --py: 0;" data-speed="-1.5" alt="Basil">
                <img src="https://cdn-icons-png.flaticon.com/512/10756/10756184.png" class="absolute bottom-1/3 right-10 w-14 opacity-80 animate-float-delayed parallax-layer drop-shadow-lg" style="--px: 0; --py: 0;" data-speed="-2" alt="Pepperoni">
            </div>

            <div class="relative z-20 w-full lg:w-[45%] px-6 sm:px-12 lg:px-16 flex flex-col justify-center parallax-layer" style="--px: 0; --py: 0;" data-speed="0.8">
                <span class="inline-block bg-white/20 backdrop-blur-md border border-white/30 text-white px-4 py-1.5 rounded-full text-xs font-bold mb-6 tracking-widest uppercase w-max">
                    Premium Quality
                </span>
                
                <div class="typing-wrapper mb-6">
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-white leading-tight typing-text">
                        Crafting the<br>Perfect Slice
                    </h1>
                </div>
                
                <p class="text-white/90 text-sm sm:text-lg mb-8 max-w-md font-medium leading-relaxed drop-shadow-md">
                    Experience the ultimate cheese pull. Hot, fresh, and baked to absolute perfection in our stone ovens.
                </p>

                <div class="flex flex-wrap items-center gap-4">
                    <button class="bg-white text-orange-600 px-8 py-3.5 rounded-full font-black text-lg glow-btn-primary">
                        Order Now
                    </button>
                    <button class="bg-transparent border-2 border-white text-white px-8 py-3.5 rounded-full font-bold text-lg glow-btn-secondary backdrop-blur-sm">
                        View Menu
                    </button>
                </div>
            </div>

            <div class="absolute left-1/2 lg:left-[60%] top-1/2 -translate-y-1/2 z-20 w-[350px] sm:w-[450px] lg:w-[650px] parallax-layer pointer-events-none" 
                 style="transform: translate(calc(-50% + var(--px, 0px)), calc(-50% + var(--py, 0px)));" 
                 data-speed="-3">
                
                <div class="relative w-full h-full animate-float">
                    <img src="https://static.vecteezy.com/system/resources/previews/021/665/568/original/delicious-pizza-with-flying-ingredients-on-transparent-background-png.png" 
                         class="w-full h-auto drop-shadow-2xl scale-110 object-contain" 
                         alt="Floating Premium Pizza">
                </div>
            </div>

        </div>
    </section>

    <script>
        // Parallax Mouse Move Effect
        const parallaxContainer = document.getElementById('parallaxContainer');
        const layers = document.querySelectorAll('.parallax-layer');

        if (parallaxContainer) {
            parallaxContainer.addEventListener('mousemove', (e) => {
                const rect = parallaxContainer.getBoundingClientRect();
                // Calculate cursor position relative to the center of the container
                const x = e.clientX - rect.left - (rect.width / 2);
                const y = e.clientY - rect.top - (rect.height / 2);

                layers.forEach(layer => {
                    const speed = parseFloat(layer.getAttribute('data-speed'));
                    // Determine movement based on speed factor
                    const xMove = (x * speed) / 50;
                    const yMove = (y * speed) / 50;

                    // Update CSS variables for smooth transformation
                    layer.style.setProperty('--px', `${xMove}px`);
                    layer.style.setProperty('--py', `${yMove}px`);
                    
                    // For elements not using the absolute center translate trick
                    if (!layer.style.transform.includes('calc')) {
                        layer.style.transform = `translate(${xMove}px, ${yMove}px)`;
                    }
                });
            });

            // Reset positions smoothly when mouse leaves
            parallaxContainer.addEventListener('mouseleave', () => {
                layers.forEach(layer => {
                    layer.style.setProperty('--px', `0px`);
                    layer.style.setProperty('--py', `0px`);
                    if (!layer.style.transform.includes('calc')) {
                        layer.style.transform = `translate(0px, 0px)`;
                    }
                });
            });
        }
    </script>
</body>
</html>
